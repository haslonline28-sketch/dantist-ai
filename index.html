<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дантист — ИИ-ассистент</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0}
.wrap{max-width:760px;margin:40px auto;padding:20px}
.card{background:white;border-radius:18px;padding:24px;box-shadow:0 4px 20px #0001}
h1{margin-top:0}.chat{min-height:360px;border:1px solid #ddd;border-radius:12px;padding:14px;margin:18px 0;overflow:auto}
.msg{padding:10px 12px;border-radius:12px;margin:8px 0;max-width:85%}
.bot{background:#f0f2f5}.user{background:#e8f0fe;margin-left:auto}
.row{display:flex;gap:10px}
input{flex:1;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:16px}
button{padding:13px 18px;border:0;border-radius:10px;cursor:pointer;font-size:16px}
.note{color:#666;font-size:13px}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>🦷 Дантист</h1>
<div class="note">ИИ-ассистент клиники</div>
<div id="chat" class="chat">
<div class="msg bot">Здравствуйте! Я ИИ-ассистент клиники «Дантист». Чем могу помочь?</div>
</div>
<div class="row">
<input id="input" placeholder="Напишите сообщение..." autocomplete="off">
<button onclick="send()">Отправить</button>
</div>
<p class="note">Демо-версия. Не вводите сюда чувствительные персональные данные.</p>
</div></div>
<script>
async function send(){
 const input=document.getElementById('input'), text=input.value.trim();
 if(!text)return;
 add(text,'user'); input.value='';
 try{
   const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
   const data=await r.json();
   add(data.reply||'Не удалось получить ответ.','bot');
 }catch(e){add('Сервер пока не подключён. Это интерфейс демо.','bot');}
}
function add(t,c){
 const d=document.createElement('div'); d.className='msg '+c; d.textContent=t;
 document.getElementById('chat').appendChild(d);
 d.scrollIntoView();
}
document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
